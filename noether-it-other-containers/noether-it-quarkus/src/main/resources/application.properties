# Quarkus' default data source (Agroal): the JTA data source of the Noether unit "library".
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:noether-quarkus;DB_CLOSE_DELAY=-1
quarkus.datasource.username=sa
quarkus.datasource.password=

# The non-JTA data source of the unit "library" (its non-jta-data-source): the same database, connections that take
# part in no transaction. Noether's TABLE generator allocates through it and commits each allocation itself.
quarkus.datasource."allocations".db-kind=h2
quarkus.datasource."allocations".jdbc.url=jdbc:h2:mem:noether-quarkus;DB_CLOSE_DELAY=-1
quarkus.datasource."allocations".username=sa
quarkus.datasource."allocations".password=
quarkus.datasource."allocations".jdbc.transactions=disabled
